<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Japón 2027</title>
    <!--
      Anti-FOUC theme script: runs synchronously before React mounts.
      Reads persisted theme from localStorage (Zustand persist key: japan2027-theme)
      and falls back to prefers-color-scheme. Adds .dark to <html> if needed.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('japan2027-theme');
          var theme = stored ? JSON.parse(stored).state.theme : null;
          if (!theme) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          // Fail silently — worst case: brief flash on first load
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
